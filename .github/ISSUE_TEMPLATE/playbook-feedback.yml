name: Playbook feedback
description: Report a confusing, incorrect, expired, or hard-to-apply part of a playbook.
title: "[Feedback]: "
labels: [feedback]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - System
        - ICP and buying committee
        - Positioning and homepage
        - Outbound
        - Event-led growth
        - Enterprise sales
        - Content and demand
        - Growth operations
        - Agent Skill or tools
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Describe the real operator job, without customer-confidential details.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What did not work or needs clarification?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or reproduction
      description: Add a public source, sanitized example, or steps that reproduce the issue.
  - type: checkboxes
    id: safety
    attributes:
      label: Publication safety
      options:
        - label: I removed credentials, private contacts, customer names, and confidential data.
          required: true
